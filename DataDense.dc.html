<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; }
    a { color: oklch(78% 0.15 250); }
    a:hover { color: oklch(70% 0.15 250); }
    .dd-wrap { width: 560px; height: 560px; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #14161a 0%, #08090b 100%); }
    .dd-case {
      width: 500px; height: 500px; border-radius: 50%;
      background: linear-gradient(150deg, #4a4e56 0%, #24272c 45%, #101215 100%);
      box-shadow: 0 24px 48px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center; padding: 17px;
    }
    .dd-screen {
      width: 466px; height: 466px; border-radius: 50%; position: relative; overflow: hidden;
      background: oklch(13% 0.02 255);
      font-family: "Rajdhani", system-ui, sans-serif;
      color: oklch(94% 0.01 255);
    }
    .dd-rings { position: absolute; top: 0; left: 0; }
    .dd-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .dd-date { position: absolute; top: 84px; left: 0; right: 0; text-align: center; font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: oklch(62% 0.01 255); }
    .dd-vitals { position: absolute; top: 112px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
    .dd-vitals span { display: flex; align-items: center; gap: 4px; font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700; }
    .dd-time { font-size: 78px; font-weight: 600; letter-spacing: -1px; line-height: 1; color: oklch(97% 0.01 255); }
    .dd-row { display: flex; align-items: center; gap: 10px; font-family: "Space Mono", monospace; font-size: 12px; font-weight: 400; color: oklch(80% 0.01 255); }
    .dd-row.tight { margin-top: 8px; }
    .dd-row.sun { margin-top: 8px; color: oklch(70% 0.01 255); }
    .dd-sep { color: oklch(40% 0.01 255); }
    .dd-icon { width: 13px; height: 13px; }
  </style>
</helmet>
<div class="dd-wrap">
  <div class="dd-case">
    <div class="dd-screen">

      <svg class="dd-rings" width="466" height="466" viewBox="0 0 466 466">
        <circle cx="233" cy="233" r="215" fill="none" stroke="oklch(30% 0.02 25)" stroke-width="7"></circle>
        <circle cx="233" cy="233" r="203" fill="none" stroke="oklch(30% 0.02 145)" stroke-width="7"></circle>
        <circle cx="233" cy="233" r="191" fill="none" stroke="oklch(30% 0.02 250)" stroke-width="7"></circle>
        <circle cx="233" cy="233" r="215" fill="none" stroke="oklch(65% 0.19 25)" stroke-width="7" stroke-linecap="round" stroke-dasharray="972.6 1350.9" transform="rotate(-90 233 233)"></circle>
        <circle cx="233" cy="233" r="203" fill="none" stroke="oklch(70% 0.15 145)" stroke-width="7" stroke-linecap="round" stroke-dasharray="867.2 1275.3" transform="rotate(-90 233 233)"></circle>
        <circle cx="233" cy="233" r="191" fill="none" stroke="oklch(65% 0.15 250)" stroke-width="7" stroke-linecap="round" stroke-dasharray="539.9 1199.8" transform="rotate(-90 233 233)"></circle>
      </svg>

      <div class="dd-date">MAR 17 SEPT</div>

      <div class="dd-vitals">
        <span style="color: oklch(70% 0.19 25);">
          <svg class="dd-icon" viewBox="0 0 24 24" fill="oklch(70% 0.19 25)"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5c3.4 0 5.1 3.4 3.6 6.7C19.5 16.4 12 21 12 21z"></path></svg>
          118
        </span>
        <span style="color: oklch(75% 0.15 145);">
          <svg class="dd-icon" viewBox="0 0 24 24" fill="none" stroke="oklch(75% 0.15 145)" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="1.5"></rect><rect x="20" y="9.5" width="2" height="5" fill="oklch(75% 0.15 145)" stroke="none"></rect><rect x="3.5" y="8.5" width="11.5" height="7" fill="oklch(75% 0.15 145)" stroke="none"></rect></svg>
          68%
        </span>
      </div>

      <div class="dd-content">
        <div class="dd-time">14:32</div>

        <div class="dd-row tight">
          <span>ALT 1240M</span><span class="dd-sep">/</span><span>▲86M</span>
        </div>
        <div class="dd-row tight">
          <span>042° NE</span><span class="dd-sep">/</span><span>14°C</span>
        </div>
        <div class="dd-row sun">
          <span>☀ 06:42</span><span class="dd-sep">·</span><span>19:58 ☾</span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
